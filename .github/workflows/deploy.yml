name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Notion 단계가 이번 커밋에서 바뀐 리포트 날짜를 찾음

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate static site
        run: python static_generator.py

      - name: Publish to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        # 이번 커밋에서 바뀐 날짜 리포트를 모두 게시 (소급한 날 포함). 없으면 최신 날짜 하나.
        run: |
          dates=$(git diff --name-only HEAD~1 HEAD -- 'database/daily/*.json' 2>/dev/null \
            | sed -n 's#^database/daily/\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)\.json$#\1#p')
          echo "dates: ${dates:-(latest)}"
          python notion_auto_publisher.py $dates
        continue-on-error: true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './static'

  # 배포를 업로드와 같은 job에서 바로 하면, 방금 올린 artifact가 GitHub API에
  # 아직 안 보여 "No artifacts named github-pages" 로 실패하는 일이 잦았음(2026-11-21).
  # job을 나누고, 그래도 못 찾으면 잠시 기다렸다 한 번 더 시도함.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 소급 push가 연달아 와도 배포끼리 겹치지 않게 차례로 돌림(build·Notion 게시는 run마다 그대로)
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
